<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>刻序 / EPHEMERIS · Cove Learning</title>
<link rel="stylesheet" href="./trace-dial.css?v=ephemeris-3">
</head>
<body>
<div class="dial-wallpaper" id="wallpaper"></div>
<main class="dial-shell">
  <header class="dial-header">
    <a class="dial-back" href="./#/archive" aria-label="返回轨迹">‹</a>
    <div class="dial-brand">COVE <span>/</span> LEARNING</div>
    <div class="dial-title">刻序 <small>/ EPHEMERIS</small></div>
  </header>

  <section class="dial-stage" id="dialStage" aria-label="竖向轨迹轮盘" data-active-hand="event">
    <svg id="atlasDecor" class="atlas-decor" aria-hidden="true" focusable="false"></svg>
    <svg id="traceDial" class="trace-dial" viewBox="0 0 760 940" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dialSvgTitle dialSvgDesc">
      <title id="dialSvgTitle">刻序 / EPHEMERIS 时间轮盘</title>
      <desc id="dialSvgDesc">短针选择十二个月，中针按当月实际天数选择日期，长针选择0至24时；半圆分为十二大格，外圈弧长表示事件实际经过时间。</desc>
      <defs>
        <g id="fourStar"><path d="M0,-10 2.3,-2.3 10,0 2.3,2.3 0,10 -2.3,2.3 -10,0 -2.3,-2.3Z"/></g>
        <g id="tinyCross"><path d="M0,-6V6M-6,0H6"/></g>
        <g id="laceUnit">
          <path d="M0 0 C7 -14 18 -14 25 0 C18 -7 7 -7 0 0Z"/>
          <path d="M7 -3 Q12 -14 18 -3 Q12 4 7 -3Z"/>
          <circle cx="12.5" cy="-5.5" r="1.7"/>
        </g>
      </defs>

      <g class="dial-geometry" aria-hidden="true">
        <path class="arc frame-a" d="M58 54 A416 416 0 0 1 58 886"/>
        <path class="arc frame-b" d="M58 66 A404 404 0 0 1 58 874"/>
        <path class="arc frame-c" d="M58 42 A428 428 0 0 1 58 898"/>
        <path class="arc month-rail-a" d="M58 72 A398 398 0 0 1 58 868"/>
        <path class="arc month-rail-b" d="M58 78 A392 392 0 0 1 58 862"/>
        <path class="arc month-ghost" d="M58 146 A324 324 0 0 1 58 794"/>
        <path class="arc day-rail" d="M58 166 A304 304 0 0 1 58 774"/>
        <path class="arc day-ghost" d="M58 188 A282 282 0 0 1 58 752"/>
        <path class="arc month-selector-rail" d="M58 224 A246 246 0 0 1 58 716"/>
        <path class="arc event-ghost" d="M58 244 A226 226 0 0 1 58 696"/>
        <path class="arc core-rail" d="M58 300 A170 170 0 0 1 58 640"/>
        <line class="diameter-line" x1="58" y1="86" x2="58" y2="854"/>
      </g>

      <g id="orbitLayer" class="orbit-layer" aria-hidden="true"></g>
      <g id="laceLayer" class="lace-layer" aria-hidden="true"></g>
      <g id="ornamentLayer" aria-hidden="true"></g>
      <g id="monthTicks"></g>
      <g id="monthLabels"></g>
      <g id="dayTicks"></g>

      <g class="dial-index index-event" aria-hidden="true"><line x1="118" y1="108" x2="162" y2="108"/><text x="168" y="103">事件</text><text class="latin" x="168" y="121">EVENT / 03</text></g>
      <g class="dial-index index-day" aria-hidden="true"><line x1="120" y1="282" x2="166" y2="282"/><text x="172" y="277">日</text><text class="latin" x="172" y="295">DAY / 02</text></g>
      <g class="dial-index index-month" aria-hidden="true"><line x1="122" y1="410" x2="168" y2="410"/><text x="174" y="405">月</text><text class="latin" x="174" y="423">MONTH / 01</text></g>

      <g id="monthHand" class="dial-hand month-hand" data-kind="month" tabindex="0" role="slider" aria-label="月份指针（短针）" aria-valuemin="1" aria-valuemax="12">
        <g class="hand-art" transform="scale(0.9534883720930233 1)">
        <path class="hand-hit event-hit" d="M188 -5 C207 -10 226 -7 258 0"/>
        <path class="event-vine hand-body" d="M0 0 C35 -1 52 -9 67 -2 C82 5 80 17 69 19 C58 21 54 11 61 7 C74 0 96 -18 119 -7 C136 1 133 15 148 15 C163 15 167 -6 184 -8 C200 -10 211 6 201 15 C190 25 177 15 183 6 C191 -5 218 -9 246 0"/>
        <path class="event-tail hand-body" d="M98 -6 Q112 -24 125 -8 M132 13 Q143 28 157 11"/>
        <use href="#fourStar" class="event-star" transform="translate(168 -8) scale(.74) rotate(12)"/>
        <path class="event-tip hand-body" d="M239 -6 L258 0 239 6 246 0Z"/>
        <circle class="hand-grip" cx="218" cy="-2" r="10"/>
        </g>
      </g>

      <g id="dayHand" class="dial-hand day-hand" data-kind="day" tabindex="0" role="slider" aria-label="日期指针（中针）" aria-valuemin="1" aria-valuemax="31">
        <g class="hand-art" transform="scale(0.9388379204892966 1)">
        <line class="hand-hit" x1="110" y1="0" x2="329" y2="0"/>
        <path class="day-rail-line hand-body" d="M0 -4 H72 L88 -11 103 -4 H178 L194 -10 210 -4 H278 L297 -13 321 -5 M0 4 H72 L88 11 103 4 H178 L194 10 210 4 H278 L297 13 321 5"/>
        <path class="day-spine hand-body" d="M26 0 H310"/>
        <path class="day-notch hand-body" d="M63 -7 V7 M107 -6 V6 M170 -6 V6 M216 -6 V6 M264 -6 V6"/>
        <path class="day-fork hand-body" d="M310 -5 L327 -14 320 0 327 14 310 5 M295 -12 L310 0 295 12"/>
        <circle class="day-hole hand-body" cx="238" cy="0" r="6"/>
        <rect class="day-block" x="132" y="-8" width="14" height="16"/>
        <circle class="hand-grip" cx="282" cy="0" r="10"/>
        </g>
      </g>

      <g id="eventHand" class="dial-hand event-hand" data-kind="event" tabindex="0" role="slider" aria-label="时间与事件指针（长针）" aria-valuemin="0" aria-valuemax="1440">
        <g class="hand-art" transform="scale(1.050131926121372 1)">
        <line class="hand-hit" x1="110" y1="0" x2="389" y2="0"/>
        <path class="month-silhouette hand-body" fill-rule="evenodd" d="M0 -5 L42 -5 55 -12 70 -5 106 -4 118 -17 131 -4 191 -4 205 -12 219 -4 263 -3 276 -15 289 -3 326 -3 340 -10 354 -4 379 0 354 4 340 10 326 3 289 3 276 15 263 3 219 4 205 12 191 4 131 4 118 17 106 4 70 5 55 12 42 5 0 5 Z M78 -2 L103 -2 91 2 78 2 Z M139 -2 L187 -2 175 2 139 2 Z M229 -1.6 L259 -1.6 248 1.6 229 1.6 Z"/>
        <path class="month-filigree hand-line" d="M38 0 C65 -20 83 20 108 0 C132 -22 151 21 181 0 C208 -18 226 17 258 0 M284 0 C303 -16 318 14 340 0"/>
        <path class="month-window hand-line" d="M112 0 Q119 -11 126 0 Q119 11 112 0Z M270 0 Q278 -9 286 0 Q278 9 270 0Z"/>
        <use href="#fourStar" class="hand-sigil" transform="translate(345 0) scale(.72)"/>
        <circle class="hand-grip" cx="316" cy="0" r="10"/>
        <path class="event-endpoint" d="M373 -3 L379 0 373 3 375 0Z"/>
        </g>
      </g>

      <g id="eventNodes"></g>
      <g id="feedbackLayer" class="feedback-layer" aria-hidden="true"></g>

      <g class="dial-hub" aria-hidden="true">
        <circle cx="58" cy="470" r="34" class="hub-orbit outer"/>
        <circle cx="58" cy="470" r="24" class="hub-orbit middle"/>
        <circle cx="58" cy="470" r="14" class="hub-orbit inner"/>
        <path class="hub-star" d="M58 449 L63 465 L79 470 L63 475 L58 491 L53 475 L37 470 L53 465Z"/>
        <circle cx="58" cy="470" r="3.5" class="hub-core"/>
      </g>
    </svg>

    <aside class="stage-editorial collapsed" id="eventEditorial" aria-live="polite">
      <header class="editorial-top">
        <div class="editorial-coordinate"><span>⌖</span> TEMPUS <i>/</i> ARCHIVE</div>
        <div class="editorial-date"><span id="readoutYear">2026</span><strong id="readoutMonth">10</strong><i>/</i><strong id="readoutDay">19</strong></div>
        <small id="readoutWeekday">周一 · MONDAY</small>
      </header>
      <section class="editorial-bottom">
        <span class="editorial-kicker" id="eventKind">EPHEMERIS / SELECT</span>
        <h1 id="eventTitle">点击轮盘上的事件标记</h1>
        <p id="eventObject">事件会沿着轨迹展开。</p>
        <div class="editorial-meta"><span id="detailTime">—</span><span id="detailType">TIME / EVENT</span></div>
        <button class="editorial-close" id="closeEditorial" type="button" hidden>收起 · CLOSE</button>
      </section>
    </aside>

  </section>

  <footer class="dial-footer">
    <div class="dial-key" role="group" aria-label="指针选择">
      <button type="button" data-focus-hand="month" aria-label="短针：月份"><span class="key-index">01</span><i class="month" aria-hidden="true"></i><span class="key-label">月</span></button>
      <button type="button" data-focus-hand="day" aria-label="中针：日期"><span class="key-index">02</span><i class="day" aria-hidden="true"></i><span class="key-label">日</span></button>
      <button type="button" data-focus-hand="event" aria-label="长针：事件"><span class="key-index">03</span><i class="event" aria-hidden="true"></i><span class="key-label">事件</span></button>
    </div>
    <button id="resetDial" type="button">↻ RESET</button>
    <p><span>EPHEMERIS / 24H</span> 短针选月，中针选日，长针读时。点按事件或弧线展开。</p>
  </footer>
</main>
<div class="dial-toast" id="dialToast" role="status" aria-live="polite"></div>
<script type="module" src="./trace-dial.js?v=ephemeris-3"></script>
</body>
</html>

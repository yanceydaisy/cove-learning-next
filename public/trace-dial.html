<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#edf1f5">
<title>Cove Learning · Trace Dial Lab</title>
<link rel="stylesheet" href="./trace-dial.css">
</head>
<body>
<div class="dial-wallpaper" id="wallpaper"></div>
<main class="dial-shell">
  <header class="dial-header">
    <a class="dial-back" href="./#/archive" aria-label="返回轨迹">‹</a>
    <div class="dial-brand">COVE <span>/</span> LEARNING</div>
    <div class="dial-title">TRACE DIAL <small>· LAB 02</small></div>
  </header>

  <section class="dial-stage" aria-label="竖向轨迹轮盘">
    <svg id="traceDial" class="trace-dial" viewBox="0 0 760 940" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dialSvgTitle dialSvgDesc">
      <title id="dialSvgTitle">Cove Learning 竖向时间轮盘</title>
      <desc id="dialSvgDesc">三根可拖动指针分别选择月份、日期和当天事件；轮盘上的事件点可点击展开。</desc>
      <defs>
        <filter id="selectedGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="monthHandShape" d="M0,-6 L50,-6 L67,-12 L82,-6 L220,-5 L239,-14 L253,-5 L316,-4 L337,-18 L368,0 L337,18 L316,4 L253,5 L239,14 L220,5 L82,6 L67,12 L50,6 L0,6 Z"/>
        <path id="dayHandShape" d="M0,-5 L42,-5 L58,-12 L73,-5 L168,-4 L184,-13 L199,-4 L263,-3 L282,-14 L307,0 L282,14 L263,3 L199,4 L184,13 L168,4 L73,5 L58,12 L42,5 L0,5 Z"/>
        <path id="eventHandShape" d="M0,-4 L36,-4 L49,-10 L63,-4 L128,-3 L143,-11 L159,-3 L206,-2 L224,-12 L246,0 L224,12 L206,2 L159,3 L143,11 L128,3 L63,4 L49,10 L36,4 L0,4 Z"/>
        <g id="smallStar">
          <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z"/>
        </g>
      </defs>

      <g class="dial-geometry">
        <path class="arc frame-a" d="M58 54 A416 416 0 0 1 58 886"/>
        <path class="arc frame-b" d="M58 70 A400 400 0 0 1 58 870"/>
        <path class="arc frame-c" d="M58 86 A384 384 0 0 1 58 854"/>
        <path class="arc month-rail" d="M58 112 A358 358 0 0 1 58 828"/>
        <path class="arc month-ghost" d="M58 130 A340 340 0 0 1 58 810"/>
        <path class="arc day-rail" d="M58 168 A302 302 0 0 1 58 772"/>
        <path class="arc day-ghost" d="M58 188 A282 282 0 0 1 58 752"/>
        <path class="arc event-rail" d="M58 228 A242 242 0 0 1 58 712"/>
        <path class="arc event-ghost" d="M58 246 A224 224 0 0 1 58 694"/>
        <path class="arc core-rail" d="M58 302 A168 168 0 0 1 58 638"/>
        <line class="diameter-line" x1="58" y1="92" x2="58" y2="848"/>
      </g>

      <g id="ornamentLayer" aria-hidden="true"></g>
      <g id="monthTicks"></g>
      <g id="monthLabels"></g>
      <g id="dayTicks"></g>
      <g id="eventNodes"></g>

      <g class="dial-index index-month">
        <line x1="116" y1="116" x2="160" y2="116"/>
        <text x="166" y="111">月</text><text class="latin" x="166" y="128">MONTH</text>
      </g>
      <g class="dial-index index-day">
        <line x1="116" y1="286" x2="160" y2="286"/>
        <text x="166" y="281">日</text><text class="latin" x="166" y="298">DAY</text>
      </g>
      <g class="dial-index index-event">
        <line x1="116" y1="416" x2="160" y2="416"/>
        <text x="166" y="411">事件</text><text class="latin" x="166" y="428">EVENT</text>
      </g>

      <g id="monthHand" class="dial-hand month-hand" data-kind="month" tabindex="0" aria-label="月份指针">
        <line class="hand-hit" x1="0" y1="0" x2="382" y2="0"/>
        <use href="#monthHandShape" class="hand-body"/>
        <circle class="hand-ring" cx="264" cy="0" r="13"/>
        <circle class="hand-core" cx="264" cy="0" r="3.5"/>
        <path class="hand-cut" d="M96 0 h82 M205 0 h38 M292 0 h25"/>
      </g>

      <g id="dayHand" class="dial-hand day-hand" data-kind="day" tabindex="0" aria-label="日期指针">
        <line class="hand-hit" x1="0" y1="0" x2="320" y2="0"/>
        <use href="#dayHandShape" class="hand-body"/>
        <circle class="hand-ring" cx="213" cy="0" r="11"/>
        <path class="hand-cut" d="M82 0 h64 M170 0 h32 M236 0 h26"/>
      </g>

      <g id="eventHand" class="dial-hand event-hand" data-kind="event" tabindex="0" aria-label="事件指针">
        <line class="hand-hit" x1="0" y1="0" x2="260" y2="0"/>
        <use href="#eventHandShape" class="hand-body"/>
        <circle class="hand-ring" cx="174" cy="0" r="9"/>
        <path class="hand-cut" d="M72 0 h42 M137 0 h24 M194 0 h18"/>
      </g>

      <g class="dial-hub" aria-hidden="true">
        <circle cx="58" cy="470" r="31" class="hub-orbit"/>
        <circle cx="58" cy="470" r="22" class="hub-orbit inner"/>
        <circle cx="58" cy="470" r="9" class="hub-core"/>
        <path class="hub-star" d="M58 442 L64 464 L86 470 L64 476 L58 498 L52 476 L30 470 L52 464 Z"/>
      </g>
    </svg>

    <aside class="stage-editorial collapsed" id="eventEditorial" aria-live="polite">
      <div class="editorial-rule"></div>
      <span class="editorial-kicker" id="eventKind">TRACE / SELECT</span>
      <div class="editorial-date">
        <span id="readoutYear">2026</span>
        <strong id="readoutMonth">10</strong><i>/</i><strong id="readoutDay">19</strong>
      </div>
      <small id="readoutWeekday">周一 · MONDAY</small>
      <h1 id="eventTitle">点击轮盘上的事件标记</h1>
      <p id="eventObject">事件会在这里展开，而不是进入卡片。</p>
      <div class="editorial-meta">
        <span id="detailTime">—</span>
        <span id="detailType">TRACE EVENT</span>
      </div>
      <button class="editorial-close" id="closeEditorial" type="button" hidden>收起 · CLOSE</button>
    </aside>

    <div class="dial-key" aria-hidden="true">
      <span><i class="month"></i>月</span>
      <span><i class="day"></i>日</span>
      <span><i class="event"></i>事件</span>
    </div>
  </section>

  <footer class="dial-footer">
    <p><span>TRACE DIAL / 02</span> 拖动三根指针选择时间；点按内圈标记展开事件。</p>
    <button id="resetDial" type="button">↻ RESET</button>
  </footer>
</main>
<div class="dial-toast" id="dialToast" role="status" aria-live="polite"></div>
<script type="module" src="./trace-dial.js"></script>
</body>
</html>

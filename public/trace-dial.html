<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ebe7dc">
<title>Cove Learning · Trace Dial</title>
<link rel="stylesheet" href="./trace-dial.css">
</head>
<body>
<div class="dial-wallpaper" id="wallpaper"></div>
<main class="dial-shell">
  <header class="dial-header">
    <a class="dial-back" href="./#/archive" aria-label="返回轨迹">‹</a>
    <div class="dial-brand">COVE <span>/</span> LEARNING</div>
    <div class="dial-title">指针轮盘 <span>· TRACE DIAL</span></div>
  </header>

  <section class="dial-stage" aria-label="轨迹时间轮盘">
    <div class="dial-constellation top-star">✦</div>
    <div class="dial-constellation star-a">✧</div>
    <div class="dial-constellation star-b">✦</div>
    <div class="dial-constellation star-c">✧</div>

    <svg id="traceDial" class="trace-dial" viewBox="0 0 820 520" role="img" aria-labelledby="dialSvgTitle dialSvgDesc">
      <title id="dialSvgTitle">Cove Learning 时间轮盘</title>
      <desc id="dialSvgDesc">三根可拖动指针分别选择月份、日期和当天的学习事件。</desc>
      <defs>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="microGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.1" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fbf8ef"/>
          <stop offset=".34" stop-color="#8994ad"/>
          <stop offset=".52" stop-color="#eef0ee"/>
          <stop offset=".74" stop-color="#263657"/>
          <stop offset="1" stop-color="#dfe5ef"/>
        </linearGradient>
        <linearGradient id="inkMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#13213e"/>
          <stop offset=".55" stop-color="#293e68"/>
          <stop offset="1" stop-color="#101a31"/>
        </linearGradient>
        <radialGradient id="hubGem">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".24" stop-color="#91b4ff"/>
          <stop offset=".54" stop-color="#263f78"/>
          <stop offset=".78" stop-color="#0c1630"/>
          <stop offset="1" stop-color="#050a15"/>
        </radialGradient>
        <pattern id="engrave" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="rgba(31,48,82,.12)" stroke-width="1"/>
        </pattern>
        <path id="monthHandShape" d="M0 0 C-8 -15 -9 -40 -5 -66 L-11 -82 L-4 -97 L-4 -190 L-15 -215 L0 -248 L15 -215 L4 -190 L4 -97 L11 -82 L5 -66 C9 -40 8 -15 0 0Z"/>
        <path id="dayHandShape" d="M0 0 C-7 -12 -9 -28 -5 -46 L-12 -61 L-6 -78 L-4 -132 L-18 -149 L0 -177 L18 -149 L4 -132 L6 -78 L12 -61 L5 -46 C9 -28 7 -12 0 0Z"/>
        <path id="eventHandShape" d="M0 0 C-6 -9 -8 -20 -5 -33 L-12 -45 L-5 -60 L-3 -93 L-14 -108 L0 -129 L14 -108 L3 -93 L5 -60 L12 -45 L5 -33 C8 -20 6 -9 0 0Z"/>
      </defs>

      <g class="dial-background">
        <path class="arc outer" d="M70 470 A340 340 0 0 1 750 470"/>
        <path class="arc outer-inner" d="M88 470 A322 322 0 0 1 732 470"/>
        <path class="arc month-rail" d="M108 470 A302 302 0 0 1 712 470"/>
        <path class="arc day-rail" d="M160 470 A250 250 0 0 1 660 470"/>
        <path class="arc event-rail" d="M220 470 A190 190 0 0 1 600 470"/>
        <path class="arc event-rail ghost" d="M238 470 A172 172 0 0 1 582 470"/>
        <path class="arc inner-ghost" d="M286 470 A124 124 0 0 1 534 470"/>
      </g>

      <g id="monthTicks"></g>
      <g id="monthLabels"></g>
      <g id="dayTicks"></g>
      <g id="eventNodes"></g>

      <g class="axis-guide">
        <line x1="410" y1="470" x2="410" y2="103"/>
        <circle cx="410" cy="470" r="115"/>
        <circle cx="410" cy="470" r="65"/>
      </g>

      <g class="dial-caption caption-month">
        <text x="94" y="183">月</text><text class="latin" x="94" y="204">MONTH</text><line x1="132" y1="189" x2="171" y2="189"/>
      </g>
      <g class="dial-caption caption-day">
        <text x="182" y="304">日</text><text class="latin" x="182" y="325">DAY</text><line x1="212" y1="310" x2="251" y2="310"/>
      </g>
      <g class="dial-caption caption-event">
        <text x="225" y="393">事件</text><text class="latin" x="225" y="414">EVENT</text><line x1="271" y1="399" x2="310" y2="399"/>
      </g>

      <g id="monthHand" class="dial-hand month-hand" data-kind="month" tabindex="0" aria-label="月份指针">
        <line class="hand-hit" x1="0" y1="0" x2="0" y2="-262"/>
        <use href="#monthHandShape" class="hand-body"/>
        <circle class="hand-jewel" cx="0" cy="-205" r="9"/>
        <circle class="hand-jewel-core" cx="0" cy="-205" r="3.2"/>
        <path class="hand-filigree" d="M-16 -97 C-39 -114 -31 -140 -12 -145 C-21 -127 -14 -113 0 -108 C14 -113 21 -127 12 -145 C31 -140 39 -114 16 -97"/>
      </g>
      <g id="dayHand" class="dial-hand day-hand" data-kind="day" tabindex="0" aria-label="日期指针">
        <line class="hand-hit" x1="0" y1="0" x2="0" y2="-192"/>
        <use href="#dayHandShape" class="hand-body"/>
        <circle class="hand-jewel" cx="0" cy="-142" r="8"/>
        <path class="hand-filigree" d="M-13 -67 C-29 -78 -25 -97 -10 -103 C-17 -88 -10 -78 0 -74 C10 -78 17 -88 10 -103 C25 -97 29 -78 13 -67"/>
      </g>
      <g id="eventHand" class="dial-hand event-hand" data-kind="event" tabindex="0" aria-label="事件指针">
        <line class="hand-hit" x1="0" y1="0" x2="0" y2="-145"/>
        <use href="#eventHandShape" class="hand-body"/>
        <circle class="hand-jewel" cx="0" cy="-104" r="7"/>
        <path class="hand-filigree" d="M-10 -49 C-23 -59 -19 -72 -8 -77 C-13 -66 -8 -58 0 -55 C8 -58 13 -66 8 -77 C19 -72 23 -59 10 -49"/>
      </g>

      <g class="dial-hub" aria-hidden="true">
        <circle class="hub-halo" cx="410" cy="470" r="34"/>
        <circle class="hub-ring ring-a" cx="410" cy="470" r="26"/>
        <circle class="hub-ring ring-b" cx="410" cy="470" r="19"/>
        <circle class="hub-gem" cx="410" cy="470" r="13"/>
        <path class="hub-star" d="M410 449 L416 464 L431 470 L416 476 L410 491 L404 476 L389 470 L404 464Z"/>
      </g>
    </svg>

    <div class="dial-legend" aria-hidden="true">
      <span><i class="legend-dot month"></i>月份</span>
      <span><i class="legend-dot day"></i>日期</span>
      <span><i class="legend-dot event"></i>事件</span>
    </div>
  </section>

  <section class="dial-readout">
    <div class="readout-date">
      <span class="readout-year" id="readoutYear">2026</span>
      <div><strong id="readoutMonth">10</strong><em>/</em><strong id="readoutDay">16</strong></div>
      <small id="readoutWeekday">周五 · FRIDAY</small>
    </div>
    <div class="readout-event">
      <span class="event-kicker" id="eventKind">TRACE EVENT</span>
      <h1 id="eventTitle">轨迹记录</h1>
      <p id="eventObject">Cove Learning</p>
      <span class="event-status" id="eventStatus">已完成</span>
    </div>
  </section>

  <section class="detail-card">
    <div class="detail-heading"><span>✦</span><strong>事件详情</strong><small>EVENT DETAILS</small></div>
    <div class="detail-row"><span class="detail-icon">◫</span><small>关联</small><strong id="detailObject">—</strong></div>
    <div class="detail-row"><span class="detail-icon">◷</span><small>时间</small><strong id="detailTime">—</strong></div>
    <div class="detail-row"><span class="detail-icon">✧</span><small>类型</small><strong id="detailType">—</strong></div>
  </section>

  <footer class="dial-actions">
    <button id="resetDial" type="button"><span>↻</span>重置</button>
    <button id="prevEvent" type="button"><span>‹</span>上一个</button>
    <button id="nextEvent" type="button">下一个<span>›</span></button>
  </footer>
</main>
<div class="dial-toast" id="dialToast" role="status" aria-live="polite"></div>
<script type="module" src="./trace-dial.js"></script>
</body>
</html>
